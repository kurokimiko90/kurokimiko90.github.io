<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Fresh ideas, imagination, and creative collaboration.">
  <title>Studio — Imagination meets craft</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #fff;
      --subtle: #f5f6f8;
      --neutral: #e9ebef;
      --ink: #101214;
      --muted: #5d6670;
      --border: #d9dde3;
      --border-bold: #aeb5bf;
      --brand: #2f6bff;
      --lime: #c8f135;
      --purple: #9f63ff;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --page-padding: 48px;
      --motion-fast: 100ms;
      --motion-enter: 250ms;
      --ease-out: cubic-bezier(0, .4, 0, 1);
      --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; }
    ::selection { background: var(--lime); color: var(--ink); }

    .studio {
      display: grid;
      grid-template-rows: 72px minmax(0, 1fr);
      min-height: 100svh;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
      background-color: var(--canvas);
      background-image: radial-gradient(circle, var(--border) 1px, transparent 1.1px);
      background-size: 28px 28px;
    }

    .topbar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-width: 0;
      padding-inline: max(var(--page-padding), calc((100vw - 1280px) / 2));
      border-bottom: 1px solid var(--border);
      background: rgb(255 255 255 / 90%);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-height: 44px;
      font-size: 14px;
      font-weight: 760;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: var(--radius-sm);
      background: var(--brand);
      color: #fff;
      transform: rotate(-5deg);
    }

    .top-note {
      color: var(--muted);
      font: 700 12px/1.4 var(--font-mono);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .footer-grid {
      position: relative;
      display: grid;
      grid-template-columns: minmax(220px, .72fr) minmax(400px, 1.35fr) minmax(260px, .83fr);
      gap: 32px;
      width: 100%;
      max-width: 1376px;
      min-height: 0;
      margin-inline: auto;
      padding: 56px var(--page-padding) 40px;
      align-items: stretch;
    }

    .panel {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: rgb(255 255 255 / 92%);
    }

    .panel-index,
    .chip {
      font: 700 12px/1.4 var(--font-mono);
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .panel-index { color: var(--brand); }
    .chip {
      display: inline-flex;
      width: max-content;
      max-width: 100%;
      margin-top: 32px;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--subtle);
      color: var(--muted);
      white-space: nowrap;
    }

    h1, h2 { margin: 0; letter-spacing: -.055em; }
    h1 {
      margin-top: 20px;
      font-size: clamp(2.55rem, 4.7vw, 5.8rem);
      font-weight: 780;
      line-height: .94;
    }
    h1 span { color: var(--brand); }
    h2 {
      margin-top: 20px;
      font-size: clamp(1.9rem, 2.5vw, 3.2rem);
      font-weight: 760;
      line-height: 1.02;
    }

    .footer-nav {
      display: grid;
      gap: 1px;
      margin-top: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--border);
    }
    .footer-nav span {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      padding: 11px 14px;
      background: var(--canvas);
      font-size: 14px;
      transition: color 50ms var(--ease-out), background 50ms var(--ease-out);
    }
    .footer-nav span::after { color: var(--brand); content: '↗'; }

    .character-stage {
      position: relative;
      z-index: 1;
      min-width: 0;
      min-height: 560px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--subtle);
      box-shadow: 0 1px 2px #091e4224, 0 3px 8px #091e4214;
    }
    .character-stage::before {
      position: absolute;
      z-index: 2;
      top: 20px;
      left: 20px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgb(255 255 255 / 92%);
      color: var(--brand);
      content: '02 / HUMAN';
      font: 700 12px/1.4 var(--font-mono);
      letter-spacing: .09em;
    }
    .character-stage::after {
      position: absolute;
      z-index: 0;
      right: -18%;
      bottom: -18%;
      width: 62%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--brand);
      content: '';
      opacity: .08;
    }
    .character-art {
      --gaze-x: 0px;
      --gaze-y: 0px;
      position: absolute;
      z-index: 1;
      inset: 0;
    }
    .character-art > img,
    .gaze-layer {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }
    .gaze-layer { overflow: visible; }
    .pupils {
      transform: translate(var(--gaze-x), var(--gaze-y));
      transition: transform var(--motion-enter) var(--ease-out);
    }

    .contact { gap: 0; }
    .note {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .socials {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: auto;
      padding-top: 32px;
    }
    .socials span {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--canvas);
      font-size: 13px;
      font-weight: 700;
      transition: transform var(--motion-fast) var(--ease-out), border-color 50ms var(--ease-out);
    }

    @media (hover: hover) and (pointer: fine) {
      .footer-nav span:hover { background: var(--subtle); color: var(--brand); }
      .socials span:hover { border-color: var(--brand); transform: translateY(-2px); }
    }

    @media (max-width: 920px) {
      :root { --page-padding: 32px; }
      .footer-grid {
        grid-template-columns: 1fr 1fr;
        align-items: auto;
      }
      .character-stage { grid-column: 1 / -1; grid-row: 2; min-height: 520px; }
      .idea { grid-column: 1; grid-row: 1; min-height: 430px; }
      .contact { grid-column: 2; grid-row: 1; min-height: 430px; }
    }

    @media (max-width: 640px) {
      :root { --page-padding: 16px; }
      .studio { display: block; min-height: 100svh; overflow: clip; }
      .topbar { height: 64px; }
      .top-note { display: none; }
      .footer-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding-block: 24px 0;
      }
      .panel { min-height: auto; padding: 20px; }
      .chip { margin-top: 24px; }
      h1 { font-size: clamp(3rem, 16vw, 4.6rem); }
      h2 { font-size: clamp(2rem, 10.5vw, 3rem); }
      .footer-nav, .socials { margin-top: 32px; }
      .footer-nav { grid-template-columns: 1fr 1fr; }
      .character-stage {
        order: 3;
        min-height: 0;
        aspect-ratio: .86;
        margin-inline: calc(var(--page-padding) * -1);
        border-right: 0;
        border-bottom: 0;
        border-left: 0;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      }
      .character-stage::before { top: 16px; left: 16px; }
    }

    @media (max-width: 360px) {
      .panel { padding: 16px; }
      .footer-grid { gap: 12px; }
      .footer-nav { grid-template-columns: 1fr; }
      h1 { font-size: 2.9rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <footer class="studio" aria-label="Footer">
    <header class="topbar">
      <a class="brand" href="#idea" aria-label="Back to the idea section">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span>PORTFOLIO STUDIO</span>
      </a>
      <span class="top-note">Collaborative clarity / 2026</span>
    </header>

    <div class="footer-grid">
      <section class="panel idea" id="idea">
        <span class="panel-index">01 / IDEA</span>
        <span class="chip">have a fresh idea?</span>
        <h1>imagination<br>meets <span>craft</span></h1>
        <div class="footer-nav" aria-label="Footer navigation">
          <span>Made</span>
          <span>Story</span>
          <span>In the lab</span>
          <span>Say hey</span>
        </div>
      </section>

      <div class="character-stage" aria-hidden="true">
        <div class="character-art" data-character>
          <img src="assets/studio/avatar-v3.png" alt="">
          <svg class="gaze-layer" viewBox="0 0 1024 1024" preserveAspectRatio="xMidYMax meet">
            <defs>
              <clipPath id="eye-left"><ellipse cx="423" cy="404" rx="53" ry="57"></ellipse></clipPath>
              <clipPath id="eye-right"><ellipse cx="620" cy="404" rx="53" ry="57"></ellipse></clipPath>
            </defs>
            <g class="pupils">
              <g clip-path="url(#eye-left)">
                <circle cx="423" cy="404" r="30" fill="#101214"></circle>
                <circle cx="411" cy="391" r="7" fill="#fff"></circle>
                <circle cx="432" cy="416" r="4" fill="#c8f135"></circle>
              </g>
              <g clip-path="url(#eye-right)">
                <circle cx="620" cy="404" r="30" fill="#101214"></circle>
                <circle cx="608" cy="391" r="7" fill="#fff"></circle>
                <circle cx="629" cy="416" r="4" fill="#c8f135"></circle>
              </g>
            </g>
          </svg>
        </div>
      </div>

      <section class="panel contact" id="contact">
        <span class="panel-index">03 / CONTACT</span>
        <span class="chip">say hey</span>
        <h2>let’s team up!<br>bring us your idea*</h2>
        <p class="note">*good things start with one spark. let’s make yours.</p>
        <div class="socials" aria-label="Social platforms">
          <span>LinkedIn</span>
          <span>Instagram</span>
          <span>TikTok</span>
        </div>
      </section>
    </div>
  </footer>

  <script>
    (() => {
      const art = document.querySelector('[data-character]');
      if (!art) return;

      const mobile = matchMedia('(max-width: 640px)');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const directions = 8;
      const step = Math.PI * 2 / directions;
      const maxGaze = 14;
      let frame = 0;
      let startedAt = performance.now();

      const applyGaze = angle => {
        const snapped = Math.round(angle / step) * step;
        art.style.setProperty('--gaze-x', `${Math.cos(snapped) * maxGaze}px`);
        art.style.setProperty('--gaze-y', `${Math.sin(snapped) * maxGaze}px`);
      };

      const centerGaze = () => {
        art.style.setProperty('--gaze-x', '0px');
        art.style.setProperty('--gaze-y', '0px');
      };

      const animateMobile = now => {
        if (!mobile.matches || reducedMotion.matches) return;
        applyGaze(Math.floor((now - startedAt) / 700) % directions * step);
        frame = requestAnimationFrame(animateMobile);
      };

      const updateMode = () => {
        cancelAnimationFrame(frame);
        centerGaze();
        startedAt = performance.now();
        if (mobile.matches && !reducedMotion.matches) frame = requestAnimationFrame(animateMobile);
      };

      addEventListener('pointermove', event => {
        if (mobile.matches || reducedMotion.matches) return;
        const rect = art.getBoundingClientRect();
        const imageSize = Math.min(rect.width, rect.height);
        const imageLeft = rect.left + (rect.width - imageSize) / 2;
        const imageTop = rect.bottom - imageSize;
        const eyeX = imageLeft + imageSize * .51;
        const eyeY = imageTop + imageSize * .4;
        const dx = event.clientX - eyeX;
        const dy = event.clientY - eyeY;
        if (Math.hypot(dx, dy) > 10) applyGaze(Math.atan2(dy, dx));
      }, { passive: true });

      mobile.addEventListener('change', updateMode);
      reducedMotion.addEventListener('change', updateMode);
      updateMode();
    })();
  </script>
</body>
</html>
